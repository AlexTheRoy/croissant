name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:example
      - name: Guard against committed client data
        run: |
          if git ls-files | grep -E '^(accounts\.json|dist/)'; then
            echo "Client data must not be committed"; exit 1
          fi
